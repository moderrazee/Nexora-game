<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA — 3D Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07120f;font-family:Arial,sans-serif;color:white}
#ui{position:fixed;top:0;left:0;width:100%;padding:15px 20px;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.logo{font-size:25px;font-weight:900;letter-spacing:7px;color:#61dfff;text-shadow:0 0 15px #168cff}
.info{font-size:12px;letter-spacing:2px;color:#c6d9d2}
#hint{position:fixed;bottom:15px;left:15px;background:#071b1bd9;border:1px solid #397b7b;border-radius:10px;padding:12px;font-size:12px;color:#c7e8e1;z-index:2}
</style>
</head>
<body>
<div id="ui">
  <div class="logo">NEXORA</div>
  <div class="info">3 VS 3 · 3D ARENA</div>
</div>
<div id="hint">ПЕРЕТАСКИВАЙ — ВРАЩЕНИЕ КАМЕРЫ<br>ЩИПOК — ПРИБЛИЖЕНИЕ</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071510);
scene.fog = new THREE.Fog(0x071510, 45, 105);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(25, 29, 32);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.target.set(0,0,0);
controls.maxPolarAngle = Math.PI/2.15;
controls.minDistance = 13;
controls.maxDistance = 65;

scene.add(new THREE.HemisphereLight(0x9bdcff,0x183522,2));

const sun = new THREE.DirectionalLight(0xffe4bb,2.5);
sun.position.set(-20,35,18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

function material(color,roughness=0.9){
 return new THREE.MeshStandardMaterial({color,roughness});
}
const grass=material(0x174d35);
const darkGrass=material(0x103b2b);
const laneMat=material(0x8b7957);
const stone=material(0x626d70);
const blue=material(0x168cff);
const red=material(0xff4168);
const waterMat=new THREE.MeshStandardMaterial({
 color:0x087da9,roughness:0.22,metalness:0.2,
 transparent:true,opacity:0.9
});

function box(x,y,z,sx,sy,sz,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}
function sphere(x,y,z,r,mat){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 scene.add(m);
 return m;
}
function cylinder(x,y,z,r1,r2,h,mat){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12),mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 scene.add(m);
 return m;
}

// Остров и земля
box(0,-0.8,0,43,1.5,43,grass);
box(0,-1.6,0,45,1,45,stone);

// Лесные края
for(let i=0;i<150;i++){
 const x=(Math.random()-.5)*41;
 const z=(Math.random()-.5)*41;
 if(Math.abs(x)<5 || Math.abs(z)<4) continue;
 if(Math.abs(x)>19 || Math.abs(z)>19) continue;
 const trunk=cylinder(x,0.6,z,0.18,0.25,1.2,material(0x69452c));
 const crown=sphere(x,1.8,z,0.9,material(
  Math.random()>.5?0x176b43:0x225d3a
 ));
 crown.scale.set(1,1.2,1);
}

// Две боевые линии
box(0,0.02,-8,37,0.12,4,laneMat);
box(0,0.02,8,37,0.12,4,laneMat);

// Центральная река
box(0,0.04,0,38,0.12,3.5,waterMat);

// Берега
box(0,0.08,-2.1,38,0.2,0.45,stone);
box(0,0.08,2.1,38,0.2,0.45,stone);

// Каменные дорожки
for(let x=-17;x<=17;x+=3){
 box(x,0.12,-8,0.13,0.05,3.5,material(0xc7b58b));
 box(x,0.12,8,0.13,0.05,3.
     5,material(0xc7b58b));
}

// Башни
function tower(x,z,team){
 const color=team==='blue'?blue:red;
 cylinder(x,0.55,z,0.9,1.1,1.1,stone);
 cylinder(x,1.5,z,0.55,0.75,1.2,color);
 sphere(x,2.3,z,0.55,color);
 sphere(x,2.3,z,0.25,material(0xffffff));
 for(let i=0;i<4;i++){
  const a=i*Math.PI/2;
  box(x+Math.cos(a)*0.8,1.5,z+Math.sin(a)*0.8,0.25,1.3,0.25,stone);
 }
}
[-12,0,12].forEach(x=>tower(x,-8,'blue'));
[-12,0,12].forEach(x=>tower(x,8,'red'));

// Троны
function throne(x,z,color){
 cylinder(x,0.6,z,2.3,2.8,1.2,stone);
 box(x,1.6,z,2.8,2.1,1.5,stone);
 box(x,2.8,z,2.3,0.5,1.2,material(color));
 sphere(x,3.7,z,0.8,material(color));
 sphere(x,3.7,z,0.38,material(0xffffff));
}
throne(-18,0,0x168cff);
throne(18,0,0xff4168);

// Рошан и его логово — верхний правый угол
cylinder(14,0.12,-15,4.2,4.5,0.3,material(0x394347));
for(let i=0;i<12;i++){
 const a=i*Math.PI/6;
 const x=14+Math.cos(a)*4;
 const z=-15+Math.sin(a)*4;
 cylinder(x,0.65,z,0.5,0.8,1.2,stone);
}
const roshan=sphere(14,1.5,-15,1.5,material(0x8b3b28));
roshan.scale.set(1,1.35,0.85);
sphere(13.5,2,-16,0.18,material(0xffd45a));
sphere(14.5,2,-16,0.18,material(0xffd45a));

// Нейтральный лагерь
sphere(-9,0.65,0,0.8,material(0x8a9b45));
sphere(-7,0.5,0.5,0.55,material(0x6b8040));

// Крипы
const creeps=[];
function creep(x,z,color,dir){
 const group=new THREE.Group();
 const body=new THREE.Mesh(new THREE.SphereGeometry(0.42,14,12),material(color));
 body.position.y=0.55;
 body.castShadow=true;
 group.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(0.23,12,10),material(0xe6c9a4));
 head.position.y=1.05;
 group.add(head);
 group.position.set(x,0,z);
 scene.add(group);
 creeps.push({group,dir,start:x});
}
for(let i=0;i<5;i++){
 creep(-10-i*1.5,-8,0x168cff,1);
 creep(10+i*1.5,8,0xff4168,-1);
 creep(-10-i*1.5,8,0x168cff,1);
 creep(10+i*1.5,-8,0xff4168,-1);
}

// Декоративные огни
for(let i=0;i<20;i++){
 const x=(Math.random()-.5)*34;
 const z=(Math.random()-.5)*30;
 const light=new THREE.PointLight(0x45ffc0,0.5,3);
 light.position.set(x,1,z);
 scene.add(light);
 sphere(x,0.3,z,0.07,material(0x7dffc5));
}

function animate(){
 requestAnimationFrame(animate);
 const t=performance.now()*0.001;
 creeps.forEach((c,i)=>{
  c.group.position.x=c.start+Math.sin(t*0.5+i)*0.35;
  c.group.position.y=Math.abs(Math.sin(t*3+i))*0.12;
 });
 roshan.position.y=1.5+Math.sin(t*1.5)*0.12;
 controls.update();
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
